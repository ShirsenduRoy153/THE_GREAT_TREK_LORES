services:
  postgres:
    image: postgres:16-alpine
    container_name: great_trek_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: great_trek_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d great_trek_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
